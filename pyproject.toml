[project]
name = "biotooler"
version = "0.1.0"
description = "A Python package for bioinformatics tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biopython",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
chimera = [
    "pychimera",
]
codon_bias = [
    "codon-bias",
]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "codon-bias",  # Required for running tests
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["templates"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "templates"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
