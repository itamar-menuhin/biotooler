[project]
name = "biotooler"
version = "0.1.0"
description = "A Python package for bioinformatics tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "biopython",
    "numpy",
    "pandas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
chimera = [
    "pychimera @ git+https://github.com/CompSynthBio/pyChimera",
]
codon_bias = [
    "codon-bias",
]
disorder = [
    "metapredict>=3.0",
]
disorder-idrpred = [
    "idrpred @ git+https://github.com/matthiasblum/idrpred@1.0.3",
]
viennarna = [
    "ViennaRNA",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyright",
    "codon-bias",  # Required for running tests
]

[project.urls]
Homepage = "https://github.com/itamar-menuhin/biotooler"
Source = "https://github.com/itamar-menuhin/biotooler"
Documentation = "https://github.com/itamar-menuhin/biotooler#readme"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["templates"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "templates"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = ["--strict-markers"]

[tool.coverage.run]
source = ["src/biotooler"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
